---
- name: Flask Alkalmazás Telepítése Dockerrel
  hosts: all
  become: yes
  vars:
    db_host: "{{ lookup('env', 'DB_HOST') }}"
    db_name: "devopsdb"
    db_user: "admin"
    db_pass: "{{ lookup('env', 'DB_PASS') }}"
    docker_image: "markosz008/flask-app:latest"

  tasks:
    - name: Docker telepítése
      yum:
        name: docker
        state: present

    - name: Docker szolgáltatás elindítása
      service:
        name: docker
        state: started
        enabled: yes

    - name: ec2-user hozzáadása a docker csoporthoz
      user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Apache és egyéb zavaró folyamatok eltávolítása (port felszabadítás)
      shell: |
        sudo systemctl stop httpd || true
        sudo yum remove -y httpd || true
        sudo fuser -k 80/tcp || true
      ignore_errors: yes

    - name: Adatbázis tábla létrehozása (Docker konténerből futtatva az ellenőrzést)
      shell: |
        python3 -c "
        import mysql.connector
        full_host = '{{ db_host }}'
        host_only = full_host.split(':')[0]
        
        conn = mysql.connector.connect(
            host=host_only, 
            port=3306,
            user='{{ db_user }}', 
            password='{{ db_pass }}', 
            database='{{ db_name }}'
        )
        cursor = conn.cursor()
        cursor.execute('CREATE TABLE IF NOT EXISTS messages (id INT AUTO_INCREMENT PRIMARY KEY, content TEXT)')
        conn.commit()
        cursor.close()
        conn.close()"
      run_once: true
      ignore_errors: yes

    - name: Friss Docker Image letöltése a Docker Hub-ról
      shell: "docker pull {{ docker_image }}"

    - name: Régi konténer leállítása és törlése (ha létezik)
      shell: "docker rm -f flask-app || true"

    - name: Flask app indítása Docker konténerben
      shell: |
        DB_URL_RAW="{{ db_host }}"
        HOST_ONLY=$(echo $DB_URL_RAW | cut -d':' -f1)
        
        docker run -d --name flask-app \
          -p 80:80 \
          -e DB_HOST=$HOST_ONLY \
          -e DB_USER="{{ db_user }}" \
          -e DB_PASS="{{ db_pass }}" \
          -e DB_NAME="{{ db_name }}" \
          {{ docker_image }}