---
- name: Flask Alkalmazás Telepítése és Beállítása
  hosts: all
  become: yes
  vars:
    # Ezeket a Jenkins fogja behelyettesíteni környezeti változókból
    db_host: "{{ lookup('env', 'DB_HOST') }}"
    db_name: "devopsdb"
    db_user: "admin"
    db_pass: "NagyonTitkos1234" # Használd azt, amit a variables.tf-ben megadtál

  tasks:
    - name: Python3 és pip telepítése
      yum:
        name: 
          - python3
          - python3-pip
          - git
        state: present

    - name: Flask és MySQL connector telepítése
      pip:
        name: 
          - flask
          - mysql-connector-python
        executable: pip3

    - name: Régi Apache leállítása (hogy szabad legyen a 80-as port)
      service:
        name: httpd
        state: stopped
        enabled: no
      ignore_errors: yes

    - name: Alkalmazás letöltése a repóból
      git:
        repo: 'https://github.com/Markosz008/jenkins-tanulas.git'
        dest: /home/ec2-user/app
        force: yes

    - name: Adatbázis tábla létrehozása (csak egyszer)
      shell: |
        python3 -c "
        import mysql.connector
        # Itt szétválasztjuk a hostot és a portot
        full_host = '{{ db_host }}'
        host_only = full_host.split(':')[0]
        
        conn = mysql.connector.connect(
            host=host_only, 
            port=3306,
            user='{{ db_user }}', 
            password='{{ db_pass }}', 
            database='{{ db_name }}'
        )
        cursor = conn.cursor()
        cursor.execute('CREATE TABLE IF NOT EXISTS messages (id INT AUTO_INCREMENT PRIMARY KEY, content TEXT)')
        conn.commit()
        cursor.close()
        conn.close()"
      run_once: true

    - name: Flask app indítása sudo-val a 80-as porton
      shell: |
        # 1. Keressük meg és lőjük le, ha már fut valami a 80-as porton
        sudo fuser -k 80/tcp || true
        
        # 2. Környezeti változók előkészítése
        DB_URL_RAW="{{ db_host }}"
        export DB_HOST=$(echo $DB_URL_RAW | cut -d':' -f1)
        export DB_USER="{{ db_user }}"
        export DB_PASS="{{ db_pass }}"
        export DB_NAME="{{ db_name }}"
        
        # 3. Indítás SUDO-val a háttérben
        sudo -E nohup python3 /home/ec2-user/app/app.py > /home/ec2-user/flask.log 2>&1 &
        sleep 2
      async: 60
      poll: 0